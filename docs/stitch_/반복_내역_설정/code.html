<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>반복 내역 관리</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>tailwind.config = {darkMode: "class", theme: {extend: {colors: {primary: "#000000", secondary: "#FFC700", expense: "#FF3B30", income: "#34C759", "background-light": "#f7f7f7", "background-dark": "#191919", "card-light": "#F5F5F7", "card-dark": "#2C2C2E", "text-primary-light": "#1C1C1E", "text-primary-dark": "#FFFFFF", "text-secondary-light": "#8E8E93", "text-secondary-dark": "#8E8E93", "border-light": "#E5E5EA", "border-dark": "#3A3A3C"}, fontFamily: {display: "Manrope"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}}}};</script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-primary-light dark:text-text-primary-dark">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-border-light dark:border-border-dark px-6 md:px-10 py-3 fixed top-0 left-0 right-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm z-50">
<div class="flex items-center gap-4">
<div class="size-6 text-primary">
<svg fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.59L5.41 11 4 12.41 11 19.41l1.59-1.59L12 18.41V4h-1v12.59zM19.59 13l-1.41-1.41L13 16.17V4h-1v13l2-2 1.41 1.41L18 19.83l2.59-2.59L19.59 13z"></path>
</svg>
</div>
<h2 class="text-lg font-bold tracking-tight">PWA 가계부</h2>
</div>
<div class="hidden md:flex flex-1 justify-end gap-8">
<div class="flex items-center gap-9">
<a class="text-sm font-medium" href="#">대시보드</a>
<a class="text-sm font-medium" href="#">거래 내역</a>
<a class="text-sm font-medium text-primary" href="#">반복 내역</a>
<a class="text-sm font-medium" href="#">분석</a>
</div>
<div class="flex gap-2 items-center">
<button class="flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-card-light dark:bg-card-dark text-text-primary-light dark:text-text-primary-dark">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-card-light dark:bg-card-dark text-text-primary-light dark:text-text-primary-dark">
<span class="material-symbols-outlined">settings</span>
</button>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="User profile picture" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDBbWY2xf3hx38yGHGJwW8lCiaZruhSvZZ1XwBSZEe6I7a1AhKJLObyi1cSpI7T0wKXQGs-Usjd91aQXnKbrr-UMRHx7buiAPGKyxSHF7VnybZ_ACqpJPb-InYnC1lpm1jA9dMwaB1eDumtPFFtFEMhDYHdmbyBXzoiSfibyyH5Vdll_W7ye8eh7yeEilDVn-J3JD0mf55Kv6CECbYy_-CfNQbxWcLu8uX8b5y18HiM99GPJTDPbM2hYPbjsWX8qWBI6rOOXU6T27U");'></div>
</div>
</div>
<button class="md:hidden flex h-10 w-10 cursor-pointer items-center justify-center">
<span class="material-symbols-outlined text-2xl">menu</span>
</button>
</header>
<main class="flex-1 px-4 sm:px-6 lg:px-8 py-5 mt-16">
<div class="mx-auto max-w-4xl">
<div class="flex flex-wrap justify-between items-center gap-3 p-4">
<p class="text-4xl font-black tracking-tighter">반복 내역 관리</p>
<button class="flex max-w-[480px] cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-lg h-12 bg-primary px-6 text-base font-bold text-white tracking-wide">
<span>반복 내역 추가</span>
<span class="material-symbols-outlined">add_circle</span>
</button>
</div>
<details class="group mt-4 open">
<summary class="hidden"></summary>
<div class="bg-card-light dark:bg-card-dark rounded-xl p-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
<div class="md:col-span-2">
<label class="flex flex-col">
<p class="text-base font-medium pb-2">설명</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-[15px] text-base font-normal" placeholder="예: 월세, 통신비"/>
</label>
</div>
<label class="flex flex-col">
<p class="text-base font-medium pb-2">금액</p>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-[15px] pl-10 text-base font-normal" placeholder="0" type="number"/>
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary-light dark:text-text-secondary-dark font-medium">₩</span>
</div>
</label>
<label class="flex flex-col">
<p class="text-base font-medium pb-2">카테고리</p>
<select class="form-select flex w-full min-w-0 flex-1 overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-14 p-[15px] text-base font-normal">
<option>월세</option>
<option>통신비</option>
<option>구독료</option>
<option>교통비</option>
<option>급여</option>
</select>
</label>
<label class="flex flex-col">
<p class="text-base font-medium pb-2">반복 주기</p>
<select class="form-select flex w-full min-w-0 flex-1 overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-14 p-[15px] text-base font-normal">
<option>월별</option>
<option>주별</option>
</select>
</label>
<div></div>
<label class="flex flex-col">
<p class="text-base font-medium pb-2">시작일</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-[15px] text-base font-normal" type="date" value="2023-12-01"/>
</label>
<div class="flex flex-col">
<p class="text-base font-medium pb-2">종료일</p>
<div class="relative">
<input class="form-input peer/date-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-[15px] text-base font-normal disabled:bg-card-light dark:disabled:bg-card-dark" type="date"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3">
<input class="form-checkbox h-4 w-4 rounded text-primary focus:ring-primary/50 border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark" id="no-end-date" type="checkbox"/>
<label class="ml-2 text-sm text-text-secondary-light dark:text-text-secondary-dark" for="no-end-date">종료일 없음</label>
</div>
</div>
</div>
</div>
<div class="mt-6 flex justify-end">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-lg h-12 bg-primary px-6 text-base font-bold text-white tracking-wide">
<span>저장하기</span>
<span class="material-symbols-outlined">save</span>
</button>
</div>
</div>
</details>
<div class="mt-12">
<h2 class="text-2xl font-bold tracking-tight px-4 pb-3 pt-5">설정된 반복 내역 목록</h2>
<div class="overflow-x-auto bg-card-light dark:bg-card-dark rounded-xl">
<table class="w-full min-w-[640px] text-left">
<thead class="border-b border-border-light dark:border-border-dark">
<tr>
<th class="px-6 py-3 text-sm font-semibold text-text-secondary-light dark:text-text-secondary-dark">설명</th>
<th class="px-6 py-3 text-sm font-semibold text-text-secondary-light dark:text-text-secondary-dark">금액</th>
<th class="px-6 py-3 text-sm font-semibold text-text-secondary-light dark:text-text-secondary-dark">반복 주기</th>
<th class="px-6 py-3 text-sm font-semibold text-text-secondary-light dark:text-text-secondary-dark">다음 발생일</th>
<th class="px-6 py-3 text-sm font-semibold text-text-secondary-light dark:text-text-secondary-dark text-right">관리</th>
</tr>
</thead>
<tbody class="divide-y divide-border-light dark:divide-border-dark">
<tr>
<td class="px-6 py-4">OTT 구독료</td>
<td class="px-6 py-4 font-medium text-expense">-₩14,900</td>
<td class="px-6 py-4">매월 15일</td>
<td class="px-6 py-4">2023년 12월 15일</td>
<td class="px-6 py-4">
<div class="flex items-center justify-end gap-2">
<button class="flex h-9 w-9 items-center justify-center rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
<span class="material-symbols-outlined text-xl text-text-secondary-light dark:text-text-secondary-dark">edit</span>
</button>
<button class="flex h-9 w-9 items-center justify-center rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
<span class="material-symbols-outlined text-xl text-expense">delete</span>
</button>
</div>
</td>
</tr>
<tr>
<td class="px-6 py-4">월세</td>
<td class="px-6 py-4 font-medium text-expense">-₩550,000</td>
<td class="px-6 py-4">매월 25일</td>
<td class="px-6 py-4">2023년 12월 25일</td>
<td class="px-6 py-4">
<div class="flex items-center justify-end gap-2">
<button class="flex h-9 w-9 items-center justify-center rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
<span class="material-symbols-outlined text-xl text-text-secondary-light dark:text-text-secondary-dark">edit</span>
</button>
<button class="flex h-9 w-9 items-center justify-center rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
<span class="material-symbols-outlined text-xl text-expense">delete</span>
</button>
</div>
</td>
</tr>
<tr>
<td class="px-6 py-4">월급</td>
<td class="px-6 py-4 font-medium text-income">+₩3,000,000</td>
<td class="px-6 py-4">매월 10일</td>
<td class="px-6 py-4">2024년 1월 10일</td>
<td class="px-6 py-4">
<div class="flex items-center justify-end gap-2">
<button class="flex h-9 w-9 items-center justify-center rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
<span class="material-symbols-outlined text-xl text-text-secondary-light dark:text-text-secondary-dark">edit</span>
</button>
<button class="flex h-9 w-9 items-center justify-center rounded-lg hover:bg-black/5 dark:hover:bg-white/10">
<span class="material-symbols-outlined text-xl text-expense">delete</span>
</button>
</div>
</td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
</main>
</div>
</div>
</body></html>
